[project]
name = "digilab-reward-case-study"
version = "0.1.0"
description = "Two experiments on a virtual pet: data-science case studies"
requires-python = ">=3.12"
dependencies = [
    "duckdb==2.0.1",
    "jupyter==1.1.1",
    "matplotlib==3.11.2",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "quarto-cli==1.11.9",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"
# The notebooks' code is shown on the site (code-fold) and their outputs are committed: linting
# or formatting them would change the rendered pages, so ruff covers the .py files only.
extend-exclude = ["*.ipynb"]
force-exclude = true  # the exclusion holds also for files passed by name (pre-commit)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
