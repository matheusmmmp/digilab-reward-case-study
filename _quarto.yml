project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - notebooks/02_case_study.ipynb
    - notebooks/01_reproduce_official_results.ipynb
    - resumo-pt.qmd
    - notebooks/04_body_triage_case_study.ipynb
    - notebooks/03_reproduce_body_triage.ipynb
    - resumo-pt-corpo.qmd
    - explorer/reward.qmd
    - explorer/triage.qmd
    - data/SCHEMA.md
    - PROVENANCE.md
  resources:
    - assets/cover.png
    - explorer/data/*.json

website:
  title: "Two experiments on a virtual pet"
  description: "Two data-science case studies on a simulated virtual pet: a pre-registered experiment and an effect that shrank, every number recomputed from the published data."
  site-url: https://matheusmmmp.github.io/digilab-reward-case-study/
  repo-url: https://github.com/matheusmmmp/digilab-reward-case-study
  repo-actions: [source, issue]
  image: assets/cover.png
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - text: "Case 1: reward"
        menu:
          - href: notebooks/02_case_study.ipynb
            text: Case study
          - href: notebooks/01_reproduce_official_results.ipynb
            text: Reproduction appendix
          - href: resumo-pt.qmd
            text: Resumo em português
          - href: explorer/reward.qmd
            text: Explorer
      - text: "Case 2: the effect that shrank"
        menu:
          - href: notebooks/04_body_triage_case_study.ipynb
            text: Case study
          - href: notebooks/03_reproduce_body_triage.ipynb
            text: Reproduction appendix
          - href: resumo-pt-corpo.qmd
            text: Resumo em português
          - href: explorer/triage.qmd
            text: Explorer
      - href: data/SCHEMA.md
        text: Data schema
      - href: PROVENANCE.md
        text: Provenance

format:
  html:
    theme: cosmo
    css: assets/site.css
    toc: true
    code-fold: true
    code-tools: false
    fig-format: png
    mainfont: system-ui, -apple-system, "Segoe UI", sans-serif

execute:
  warning: false
