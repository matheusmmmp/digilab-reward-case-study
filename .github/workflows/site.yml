name: site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0  # no floating major tag after v7: pinned to the release
        with:
          enable-cache: true

      - name: Install the pinned environment
        run: uv sync --frozen

      # Integrity checks, every notebook executed (their asserts are the gate: any number that
      # differs from the official reference fails the job), then the site rendered into docs/.
      - name: Reproduce and render
        run: uv run --frozen python scripts/reproduce.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
