name: site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0  # no floating major tag after v7: pinned to the release
        with:
          enable-cache: true

      - name: Install the pinned environment, with the dev group (pytest, ruff)
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check

      - name: Check formatting
        run: uv run --frozen ruff format --check

      - name: Unit tests
        run: uv run --frozen pytest -q

      # Integrity checks, then Quarto executes every notebook (their asserts are the gate: any
      # number that differs from the official reference fails the job; _freeze/ is not committed,
      # so nothing is reused) and renders the site into docs/.
      - name: Reproduce and render
        run: uv run --frozen python scripts/reproduce.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
